name: CI

# This workflow previously reported success while running nothing:
#   - Every command in the "static analysis" and "size report" steps used `\\`
#     line continuations. Inside a YAML block scalar those are literal
#     backslashes, so bash received `cppcheck --enable=all \` and every
#     following line became "command not found". Each affected command ended in
#     `|| true`, so the job reported green.
#   - The QEMU job could never pass: qemu-system-xtensa cannot emulate an
#     ESP32-S3, and it also asserted on a log string that CONFIG_LOG_MAXIMUM_LEVEL=WARN
#     had compiled out of the binary.
#   - It built for `esp32`, which is not the target hardware.
#
# If a step here cannot fail, it should not be here.

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  IDF_VERSION: v5.5.1
  IDF_TARGET: esp32s3

jobs:
  build:
    name: Build (ESP32-S3)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        target: ${{ env.IDF_TARGET }}

    - name: Build firmware
      # The target comes from sdkconfig.defaults, which is committed. There is
      # deliberately no step that writes credentials into it: WiFi is
      # provisioned at runtime over the console and stored in NVS.
      #
      # Note this step also enforces that the image fits its OTA slot --
      # IDF runs check_sizes.py as part of the build and fails if it does not.
      run: idf.py build

    - name: Report image size
      run: |
        {
          echo "### Firmware"
          echo ""
          echo '```'
          ls -lh build/smart_home.bin
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Static analysis
      # Reports but does not block, because the tree has pre-existing findings.
      # `continue-on-error` is used rather than `|| true` so the result is
      # visible in the UI instead of being silently swallowed.
      continue-on-error: true
      run: |
        mkdir -p tests
        cppcheck --enable=warning,style,performance \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --inline-suppr \
          --xml --xml-version=2 \
          main/ 2> tests/cppcheck_report.xml
        cppcheck --enable=warning,style,performance \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          main/ || true

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/smart_home.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/ota_data_initial.bin
          build/flash_args

    - name: Upload static analysis report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-report
        path: tests/cppcheck_report.xml
        if-no-files-found: ignore

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download firmware
      uses: actions/download-artifact@v4
      with:
        name: firmware
        path: release/

    - name: Package firmware
      run: |
        cd release
        tar -czf "smart_home_firmware_${{ github.ref_name }}.tar.gz" ./*.bin ./flash_args

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/smart_home_firmware_${{ github.ref_name }}.tar.gz
        body: |
          ESP32-S3 Smart Home Firmware ${{ github.ref_name }}

          Target: ESP32-S3-DevKitC-1 (N16R8, 16 MB flash / 8 MB octal PSRAM)

          ## Installation
          1. Extract the package.
          2. Flash from the extracted directory:
             `esptool.py --chip esp32s3 write_flash @flash_args`
          3. Provision WiFi over the console, then reboot:
             `wifi_set <ssid> <password>`

          Firmware is now delivered as dual-slot OTA; flashing over USB is only
          needed for the first install.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
