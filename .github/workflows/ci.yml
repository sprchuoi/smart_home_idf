name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget flex bison gperf \
          python3 python3-pip python3-venv \
          cmake ninja-build ccache \
          libffi-dev libssl-dev dfu-util \
          libusb-1.0-0 cppcheck
    
    - name: Install ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1.2
        target: esp32
    
    - name: Setup environment
      run: |
        chmod +x make.sh
        ./make.sh setup
    
    - name: Build project
      run: |
        ./make.sh build
    
    - name: Run static analysis
      run: |
        ./make.sh test
    
    - name: Generate documentation
      run: |
        pip install -r docs/requirements.txt
        ./make.sh doc
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: firmware
        path: build/smart_home.bin
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          tests/cppcheck_report.xml
          ci_report.txt

  qemu-test:
    name: QEMU ESP32 Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-xtensa
    
    - name: Install ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1.2
        target: esp32
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: firmware
        path: build/
    
    - name: Setup QEMU
      run: |
        chmod +x make.sh
        ./make.sh setup-qemu
    
    - name: Run QEMU test
      run: |
        ./make.sh test-qemu
      continue-on-error: true
    
    - name: Upload QEMU logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: qemu-logs
        path: qemu/qemu_output.log

  ci-report:
    name: CI Report
    runs-on: ubuntu-latest
    needs: [build, qemu-test]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Generate CI report
      run: |
        echo "# CI/CD Report" > ci_summary.md
        echo "" >> ci_summary.md
        echo "Build: ${{ needs.build.result }}" >> ci_summary.md
        echo "QEMU Test: ${{ needs.qemu-test.result }}" >> ci_summary.md
        echo "" >> ci_summary.md
        echo "Generated: $(date)" >> ci_summary.md
    
    - name: Upload CI report
      uses: actions/upload-artifact@v3
      with:
        name: ci-report
        path: ci_summary.md

