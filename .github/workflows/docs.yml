name: Documentation

# Builds the Sphinx user guide and the Doxygen API reference, and publishes
# both to GitHub Pages.
#
# Previously this workflow copied Sphinx's index.html into _site/ and then
# overwrote it with a redirect page pointing at "./index.html" -- that is,
# at itself. The published site was an infinite redirect loop. Sphinx's own
# index is the landing page, so nothing needs to be generated here.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'main/**'
      - 'Doxyfile'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'main/**'
      - 'Doxyfile'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: docs/requirements.txt

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq doxygen graphviz

    - name: Install Python dependencies
      run: pip install -r docs/requirements.txt

    - name: Generate Doxygen XML/HTML
      run: doxygen Doxyfile

    - name: Build Sphinx documentation
      # Warnings are escalated to errors so the docs cannot silently rot the
      # way the firmware's docs did -- the published pages described services
      # that had been deleted.
      run: sphinx-build -W --keep-going -b html docs docs/_build/html

    - name: Assemble site
      run: |
        mkdir -p _site
        cp -r docs/_build/html/. _site/
        cp -r doxygen/html _site/doxygen
        touch _site/.nojekyll
        echo "Site contents:"
        ls _site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
