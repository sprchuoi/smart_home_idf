name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'main/**'
      - 'Doxyfile'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz plantuml default-jre
    
    - name: Install Python dependencies
      run: |
        pip install -r docs/requirements.txt
    
    - name: Generate Doxygen documentation
      run: |
        doxygen Doxyfile
        echo "✓ Doxygen generation complete"
    
    - name: Build Sphinx documentation
      run: |
        cd docs
        make html
        echo "✓ Sphinx build complete"
    
    - name: Create docs root with index redirect
      run: |
        mkdir -p _site
        cp -r docs/_build/html/* _site/
        cp -r doxygen/html _site/doxygen
        
        # Create root index.html that redirects to Sphinx docs
        cat > _site/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>ESP32 Smart Home Documentation</title>
            <meta http-equiv="refresh" content="0; url=./index.html">
            <link rel="canonical" href="./index.html">
        </head>
        <body>
            <p>Redirecting to <a href="./index.html">documentation</a>...</p>
        </body>
        </html>
        EOF
        
        # Create .nojekyll to prevent GitHub Pages from ignoring files
        touch _site/.nojekyll
        
        echo "✓ Documentation site prepared"
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: '_site'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2

