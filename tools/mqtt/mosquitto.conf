# Local test broker for bringing up an ESP32-S3 node.
#
# This is a *bench* configuration, not a deployment one: it allows anonymous
# access from anywhere on the LAN and runs without TLS. That is deliberate --
# it removes every variable except the firmware while you are proving the link
# works. The Pi's broker must not use this file as-is.
#
#   tools/mqtt/broker.sh start
#   tools/mqtt/broker.sh stop
#   tools/mqtt/broker.sh status

listener 1883 0.0.0.0

# Test only. Mosquitto 2.x defaults to refusing anonymous clients, so this has
# to be explicit. Replace with password_file before this leaves the bench.
allow_anonymous true

persistence true
persistence_location /tmp/smarthome-mosquitto/

log_dest stdout
log_type notice
log_type error
log_type warning
connection_messages true

# Firmware images are large; the default cap would reject OTA chunks.
message_size_limit 0
max_queued_messages 1000
