<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    ESP32 Smart Home Architecture
  </text>
  
  <!-- EventBus Layer (Center) -->
  <rect x="250" y="250" width="300" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="400" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="white">EventBus</text>
  <text x="400" y="310" font-size="14" text-anchor="middle" fill="white">Central IPC System</text>
  
  <!-- Services Layer (Top) -->
  <g>
    <rect x="50" y="100" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="110" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="white">WiFi Service</text>
    
    <rect x="200" y="100" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="260" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="white">MQTT Service</text>
    
    <rect x="350" y="100" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="410" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Audio Pipeline</text>
    
    <rect x="500" y="100" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="560" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Wake Word</text>
    
    <rect x="650" y="100" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="710" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="white">OTA Service</text>
  </g>
  
  <!-- State Machines (Middle) -->
  <g>
    <rect x="150" y="400" width="150" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="225" y="435" font-size="14" font-weight="bold" text-anchor="middle" fill="white">App State Machine</text>
    
    <rect x="500" y="400" width="150" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="575" y="435" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Audio State Machine</text>
  </g>
  
  <!-- Drivers Layer (Bottom) -->
  <g>
    <rect x="100" y="520" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="150" y="550" font-size="12" font-weight="bold" text-anchor="middle" fill="white">OLED Display</text>
    
    <rect x="250" y="520" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="300" y="550" font-size="12" font-weight="bold" text-anchor="middle" fill="white">I2S Audio</text>
    
    <rect x="400" y="520" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="450" y="550" font-size="12" font-weight="bold" text-anchor="middle" fill="white">UART Driver</text>
    
    <rect x="550" y="520" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="600" y="550" font-size="12" font-weight="bold" text-anchor="middle" fill="white">WiFi Driver</text>
  </g>
  
  <!-- Connection arrows to EventBus -->
  <!-- Services to EventBus -->
  <path d="M 110 160 L 110 200 L 300 250" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 260 160 L 260 200 L 350 250" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 410 160 L 410 250" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 560 160 L 560 200 L 450 250" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 710 160 L 710 200 L 500 250" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- EventBus to State Machines -->
  <path d="M 300 330 L 225 400" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 330 L 575 400" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- State Machines to Drivers (conceptual) -->
  <path d="M 225 460 L 150 520" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 225 460 L 300 520" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 575 460 L 450 520" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 575 460 L 600 520" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g transform="translate(20, 80)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#2c3e50">Core 0: Networking</text>
    <text x="0" y="20" font-size="12" font-weight="bold" fill="#2c3e50">Core 1: Application</text>
  </g>
</svg>
